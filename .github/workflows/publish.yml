name: Publish to PyPI

# Triggers on any version tag push (v0.13.1, v1.0.0, ...). Publishes via a
# PyPI API token stored as the PYPI_API_TOKEN repo secret (Settings ->
# Secrets and variables -> Actions). Switch to trusted publishing (OIDC, no
# stored secret) once the org's pypi.org trusted-publisher registration is
# sorted out — see git history for the OIDC version of this workflow.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build backend
        run: python -m pip install --upgrade pip build

      - name: Build sdist + wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
